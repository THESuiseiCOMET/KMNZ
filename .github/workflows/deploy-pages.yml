name: Deploy KMNZ 2.0 to GitHub Pages

on:
  push:
    branches: ['分支']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/分支'
    defaults:
      run:
        working-directory: KMNZ2.0
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: KMNZ2.0/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build KMNZ 2.0
        run: npm run build
        env:
          VITE_BASE_PATH: /KMNZ/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: KMNZ2.0/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
